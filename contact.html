<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacte | VRN Production</title>
  <link rel="stylesheet" href="assets/css/contact.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/images/VRNWEB.png" alt="img1">
    </div>
    <nav>
      <a href="index.html">Acasa</a>
      <a href="backstage.html">Backstage</a>
      <a href="contact.html" class="active">Contacte</a>
    </nav>
  </header>

  <main>
    <h1>Lăsați o cerere</h1>
    <form class="contact-form">
      <div class="form-group">
        <label for="nume">Nume</label>
        <input type="text" id="nume" name="nume" required>
      </div>
      <div class="form-group">
        <label for="prenume">Prenume</label>
        <input type="text" id="prenume" name="prenume" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="telefon">Număr de telefon</label>
        <input type="tel" id="telefon" name="telefon" required>
      </div>
      <div class="form-group">
        <label for="descriere">Mesaj</label>
        <textarea id="descriere" name="descriere" rows="4" required></textarea>
      </div>
      <button type="submit">Trimite</button>
    </form>
  </main>
</body>
</html>
